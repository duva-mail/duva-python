[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "duva-mail"
version = "0.2.0"
description = "Official Duva client library (transactional email API hosted in Canada)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "9573-4562 Québec inc." }]
keywords = ["duva", "email", "transactional-email", "api", "webhooks"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27,<1", "pydantic>=2.9,<3"]

[project.urls]
Homepage = "https://duva.ca"
Documentation = "https://duva.ca/en/docs"
Repository = "https://github.com/duva-mail/duva-python"
Changelog = "https://duva.ca/en/docs#changelog"

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "mypy>=1.13",
  "ruff>=0.7",
  "respx>=0.21",
]

[tool.hatch.build.targets.wheel]
packages = ["src/duva"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["duva"]
mypy_path = "src"
explicit_package_bases = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Generated from `docs/openapi.json`'s descriptions (`scripts/generate.py`), never hand-edited:
# a long docstring line here is the source spec's wording, not something to rewrap by hand.
"src/duva/_generated/*" = ["E501"]
